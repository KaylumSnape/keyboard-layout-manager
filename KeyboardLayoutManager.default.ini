; Keyboard Layout Manager v1.1.6 configuration.
; Select Reload from the system tray after editing this file.
;
; Tray actions:
; Check Now: apply the layout for currently connected keyboards.
; Show Status: show layout, detection, and configuration details.
; Open Configuration File: open this file in the default text editor.
; View on GitHub: open the Keyboard Layout Manager project page.
; Detect Connected Keyboards: list USB keyboard details.
; Add Connected US Keyboard: identify a keyboard by unplugging and reconnecting it.
; Enable Notifications and Run At Startup: toggle and save those settings.
; Reload: reload this file. Exit: close Keyboard Layout Manager.

[General]
; Show a tray notification after the script applies a layout.
ShowNotifications=false
; Notification display time in milliseconds.
NotificationDurationMs=3000
; Wait after each Win+Space attempt. Increase to 500 if switching is unreliable.
LayoutSwitchRetryDelayMs=250
; Number of layout-switch attempts. Three is normally sufficient.
LayoutSwitchMaxAttempts=3
; During startup, re-check keyboards every N milliseconds to catch delayed USB enumeration.
; Set to 0 to disable startup checks.
StartupCheckIntervalMs=5000
; Total startup check window in milliseconds (180000 = 3 minutes).
StartupCheckDurationMs=180000
; Create or remove the Startup-folder shortcut automatically.
RunAtStartup=true

[Layouts]
; Layout used when no preferred keyboard is connected.
DefaultLayout=UK
; Layout used when a preferred keyboard is connected.
PreferredLayout=US

[PreferredUSKeyboards]
; Add entries with the tray action or manually, for example:
; Keyboard1=VID_045E&PID_00DB